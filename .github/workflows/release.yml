name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: --win --x64 --arm64
          - os: ubuntu-latest
            cmd: --linux --x64 --arm64
          - os: macos-14
            cmd: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # esbuild strips types without checking them, so build alone would happily
      # ship a type error. Check before building.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Package
        run: npx electron-builder ${{ matrix.cmd }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # electron-builder also emits a combined multi-arch installer (no -x64/-arm64
      # suffix); drop it so only the per-arch installers ship.
      - name: Drop combined Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem release -Filter *.exe | Where-Object { $_.Name -notmatch '-(x64|arm64)\.exe$' } | Remove-Item -Force -Verbose
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.dmg
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release (draft)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
          body: |
            ## Downloads — pick the file for your OS

            ### 🪟 Windows
            - `*-x64.exe` — Windows 64-bit (Intel/AMD) — **most PCs**
            - `*-arm64.exe` — Windows on ARM

            ### 🍎 macOS
            - `*-arm64.dmg` — Apple Silicon (M1–M6)

            ### 🐧 Linux
            - `*-x86_64.AppImage` — any distro, no install (`chmod +x`, then run) — **most users**
            - `*-arm64.AppImage` — any distro, ARM64
            - `*-amd64.deb` / `*-arm64.deb` — Debian / Ubuntu
            - `*-x86_64.rpm` / `*-aarch64.rpm` — Fedora / RHEL

            ---

            ## ⚠️ These builds are not code-signed

            No Apple Developer or Windows signing certificate is used, so each OS
            blocks the app on first launch. Nothing is wrong with the download —
            you just have to tell the OS to trust it once.

            ### macOS

            You will hit one of two messages:

            - **"…is damaged and can't be opened. You should move it to the Trash."**
            - **"Apple could not verify… it may contain malware"**

            Neither means the download is corrupt. Both are Gatekeeper refusing an
            app that carries no Apple signature. Same fix:

            1. Open the `.dmg` and drag **AICycle Widget** into **Applications**.
               Run it from `/Applications`, not from the mounted disk image.
            2. Remove the quarantine flag macOS attached to the download:

               ```sh
               sudo xattr -dr com.apple.quarantine "/Applications/AICycle Widget.app"
               ```

               The quotes matter — the app name has a space in it. Enter your login
               password when prompted (nothing is echoed as you type).
            3. Launch it normally.

            If it still says **damaged** after step 2, give the bundle a local
            signature and try again:

            ```sh
            sudo codesign --force --deep --sign - "/Applications/AICycle Widget.app"
            ```

            On macOS 15 and later the old **right-click → Open** trick no longer
            clears this, which is why the commands above are the reliable route. For
            the "could not verify" message there is also a GUI path: launch once, let
            it be blocked, then **System Settings → Privacy & Security** → scroll
            down → **Open Anyway**. That option does *not* appear for "damaged".

            ### Windows — SmartScreen "Windows protected your PC"

            Click **More info** → **Run anyway**.

            ---
